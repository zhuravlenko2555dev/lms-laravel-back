; Production PHP settings (loaded as conf.d/zz-app.ini, overrides defaults).
[PHP]
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

memory_limit = 256M
max_execution_time = 60

; Keep upload limits aligned with nginx client_max_body_size (25m).
post_max_size = 25M
upload_max_filesize = 25M
max_file_uploads = 20

date.timezone = UTC

; Hardening
allow_url_fopen = On
allow_url_include = Off
cgi.fix_pathinfo = 0
session.cookie_httponly = On
session.cookie_secure = On
session.use_strict_mode = On

realpath_cache_size = 4096K
realpath_cache_ttl = 600
