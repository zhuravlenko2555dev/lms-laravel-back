; php-fpm pool — overrides the image default www.conf.
[www]
user = www-data
group = www-data

; TCP socket so the nginx sidecar (same Pod, shared localhost) can reach fpm.
listen = 9000

; Dynamic process manager. Tune to the container's CPU/memory limits.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Health + metrics endpoints.
;   /ping   → used by the image HEALTHCHECK and nginx.
;   /status → scraped by php-fpm-exporter for the queue/web dashboards.
ping.path = /ping
ping.response = pong
pm.status_path = /status

; Send worker output to the container log stream.
catch_workers_output = yes
decorate_workers_output = no

; Keep the environment so Kubernetes-injected env vars / secrets reach PHP.
clear_env = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
