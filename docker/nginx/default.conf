# Server block for the nginx sidecar. Serves the SPA static bundle directly and
# forwards every dynamic request (SPA routes, /api, /up) to php-fpm.
#
# Listens on 8080 (unprivileged) so nginx can run as non-root under the
# `restricted` Pod Security Standard. TLS/HTTP->HTTPS/HSTS/rate-limiting are
# terminated at Traefik (config repo), not here.

server {
    listen      8080;
    server_name _;
    root        /var/www/html/public;
    index       index.php;

    client_max_body_size 25m;
    server_tokens off;

    # Hashed, immutable SPA assets — long cache, no PHP.
    location /build/ {
        access_log off;
        expires    1y;
        add_header  Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

    # Everything else goes to the Laravel front controller. This covers:
    #   /api/*  → JSON API
    #   /up     → health endpoint (probes)
    #   /*      → SPA shell (Blade view) for client-side routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include                 fastcgi_params;
        fastcgi_pass            127.0.0.1:9000;
        fastcgi_index           index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param           DOCUMENT_ROOT   $realpath_root;
        fastcgi_hide_header     X-Powered-By;
        fastcgi_read_timeout    60s;
        # Only pass real .php files to fpm.
        try_files $uri =404;
    }

    # Never serve dotfiles (except ACME well-known, harmless here).
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
