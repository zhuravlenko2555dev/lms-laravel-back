# nginx main config for the sidecar container (stock nginx:1.27-alpine).
# Designed to run NON-ROOT with a READ-ONLY root filesystem: pid + all temp
# paths live under /tmp (mount an emptyDir at /tmp), logs go to stdout/stderr.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable temp paths (root FS is read-only; /tmp is an emptyDir).
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;
    keepalive_timeout 65;

    log_format main '$remote_addr - $status "$request" $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    include /etc/nginx/conf.d/*.conf;
}
